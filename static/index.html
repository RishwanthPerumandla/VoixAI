<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoixAI - Wingstop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            height: 100vh;
        }
        .main-panel {
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { align-self: flex-end; background: linear-gradient(135deg, #00b894, #00a085); border-bottom-right-radius: 4px; }
        .message.assistant { align-self: flex-start; background: linear-gradient(135deg, #0984e3, #0769b5); border-bottom-left-radius: 4px; }
        .message.system { align-self: center; background: rgba(255,255,255,0.1); font-size: 0.8rem; color: #888; }
        .mic-container { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .mic-button {
            width: 100px; height: 100px; border-radius: 50%; border: none;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .mic-button.ready { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; }
        .mic-button.recording { background: linear-gradient(135deg, #00b894, #00a085); color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,184,148,0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(0,184,148,0); }
        }
        .mic-button:disabled { opacity: 0.5; cursor: not-allowed; }
        .latency-bar { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 10px; margin-bottom: 10px; }
        .latency-item { text-align: center; padding: 5px 10px; background: rgba(255,255,255,0.05); border-radius: 6px; }
        .latency-item .label { font-size: 0.65rem; color: #888; text-transform: uppercase; }
        .latency-item .value { font-size: 0.85rem; font-weight: bold; font-family: monospace; }
        .latency-item .value.good { color: #00b894; }
        .latency-item .value.bad { color: #e74c3c; }
        .side-panel { display: flex; flex-direction: column; gap: 20px; }
        .order-panel, .status-panel { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; }
        .order-panel h2, .status-panel h2 { font-size: 1.1rem; margin-bottom: 15px; }
        .order-item { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; margin-bottom: 8px; font-size: 0.9rem; }
        .order-item .qty { font-weight: bold; color: #00d4ff; }
        .order-empty { color: #666; text-align: center; padding: 20px; }
        .order-total { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; margin-top: 12px; display: flex; justify-content: space-between; font-weight: bold; }
        .reset-btn { width: 100%; padding: 12px; margin-top: 15px; background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.3); border-radius: 8px; cursor: pointer; }
        .reset-btn:hover { background: rgba(231, 76, 60, 0.3); }
        .debug-panel { margin-top: 15px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; font-size: 11px; font-family: monospace; max-height: 120px; overflow-y: auto; }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
            .side-panel { order: -1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-panel">
            <div class="header">
                <h1>VoixAI</h1>
                <p>Wingstop Voice Ordering</p>
            </div>
            
            <div class="chat-container" id="chatLog"></div>
            
            <div class="latency-bar" id="latencyBar" style="display: none;">
                <div class="latency-item"><div class="label">STT</div><div class="value" id="sttMs">--</div></div>
                <div class="latency-item"><div class="label">LLM</div><div class="value" id="llmMs">--</div></div>
                <div class="latency-item"><div class="label">TTS</div><div class="value" id="ttsMs">--</div></div>
                <div class="latency-item"><div class="label">Total</div><div class="value" id="totalMs">--</div></div>
            </div>
            
            <div class="mic-container">
                <button class="mic-button ready" id="micBtn" disabled>🎤</button>
                <span id="micLabel">Connecting...</span>
            </div>
            
            <div class="debug-panel" id="debugPanel">
                <div style="color: #888;">Debug logs...</div>
            </div>
        </div>
        
        <div class="side-panel">
            <div class="order-panel">
                <h2>Current Order</h2>
                <div id="orderList"><div class="order-empty">No items</div></div>
                <button class="reset-btn" id="resetBtn">Reset</button>
            </div>
            <div class="status-panel">
                <h2>Status</h2>
                <div>State: <span id="stateValue">-</span></div>
                <div>Items: <span id="itemCount">0</span></div>
            </div>
        </div>
    </div>

    <script>
        const WS_URL = `ws://${window.location.host}/ws/conversation`;
        const SAMPLE_RATE = 16000;
        
        const micBtn = document.getElementById('micBtn');
        const micLabel = document.getElementById('micLabel');
        const chatLog = document.getElementById('chatLog');
        const debugPanel = document.getElementById('debugPanel');
        
        let ws = null;
        let audioContext = null;
        let processor = null;
        let isRecording = false;
        let audioStream = null;
        
        function log(msg) {
            console.log(msg);
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString().split(' ')[0]}] ${msg}`;
            debugPanel.appendChild(div);
            debugPanel.scrollTop = debugPanel.scrollHeight;
        }
        
        function addMessage(text, role) {
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            msg.textContent = text;
            chatLog.appendChild(msg);
            chatLog.scrollTop = chatLog.scrollHeight;
        }
        
        function updateOrder(order) {
            if (!order || !order.items || order.items.length === 0) {
                document.getElementById('orderList').innerHTML = '<div class="order-empty">No items</div>';
                return;
            }
            let html = '';
            for (const item of order.items) {
                html += `<div class="order-item"><span class="qty">${item.qty}x</span> ${item.name}</div>`;
            }
            html += `<div class="order-total"><span>Total:</span><span>${order.total_items}</span></div>`;
            document.getElementById('orderList').innerHTML = html;
        }
        
        function playAudio(base64Data) {
            const audio = new Audio('data:audio/wav;base64,' + base64Data);
            audio.play().catch(err => console.error('Audio error:', err));
        }
        
        async function initAudio() {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: { sampleRate: SAMPLE_RATE, channelCount: 1, echoCancellation: true }
                });
                
                audioContext = new AudioContext({ sampleRate: SAMPLE_RATE });
                const source = audioContext.createMediaStreamSource(audioStream);
                processor = audioContext.createScriptProcessor(4096, 1, 1);
                
                source.connect(processor);
                processor.connect(audioContext.destination);
                
                processor.onaudioprocess = (e) => {
                    if (!isRecording || !ws) return;
                    const inputData = e.inputBuffer.getChannelData(0);
                    const int16Data = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        int16Data[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32768));
                    }
                    ws.send(int16Data.buffer);
                };
                
                log('Audio ready');
            } catch (err) {
                log('Audio init failed: ' + err.message);
                micLabel.textContent = 'Mic denied';
            }
        }
        
        function connect() {
            if (ws) ws.close();
            
            micLabel.textContent = 'Connecting...';
            micBtn.disabled = true;
            
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                log('Connected');
                micLabel.textContent = 'Hold to speak';
                micBtn.disabled = false;
            };
            
            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                log(`Received: ${data.type}`);
                
                if (data.type === 'greeting' || data.type === 'response') {
                    addMessage(data.text, 'assistant');
                    if (data.audio) playAudio(data.audio);
                    if (data.order) updateOrder(data.order);
                    if (data.state) {
                        document.getElementById('stateValue').textContent = data.state.state;
                        document.getElementById('itemCount').textContent = data.state.total_items;
                    }
                    if (data.latency) {
                        document.getElementById('latencyBar').style.display = 'flex';
                        document.getElementById('sttMs').textContent = data.latency.stt_ms + 'ms';
                        document.getElementById('llmMs').textContent = data.latency.llm_ms + 'ms';
                        document.getElementById('ttsMs').textContent = data.latency.tts_ms + 'ms';
                        document.getElementById('totalMs').textContent = data.latency.total_ms + 'ms';
                    }
                    micLabel.textContent = 'Hold to speak';
                }
                else if (data.type === 'error') {
                    addMessage(data.text, 'system');
                    micLabel.textContent = 'Hold to speak';
                }
                else if (data.type === 'reset') {
                    chatLog.innerHTML = '';
                    updateOrder(null);
                    micLabel.textContent = 'Hold to speak';
                }
            };
            
            ws.onclose = () => {
                log('Disconnected - reconnecting...');
                micLabel.textContent = 'Disconnected';
                micBtn.disabled = true;
                setTimeout(connect, 3000);
            };
            
            ws.onerror = (err) => {
                log('WebSocket error');
            };
        }
        
        async function startRecording() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected');
                return;
            }
            
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            
            isRecording = true;
            micBtn.classList.remove('ready');
            micBtn.classList.add('recording');
            micLabel.textContent = 'Recording...';
            log('Recording started');
        }
        
        function stopRecording() {
            if (!isRecording) return;
            isRecording = false;
            micBtn.classList.remove('recording');
            micBtn.classList.add('ready');
            micLabel.textContent = 'Processing...';
            log('STOPPED - sending process_audio command');
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                const cmd = JSON.stringify({command: 'process_audio'});
                log('Sending: ' + cmd);
                ws.send(cmd);
                log('Command sent!');
            } else {
                log('ERROR: WebSocket not open!');
            }
        }
        
        micBtn.addEventListener('mousedown', startRecording);
        micBtn.addEventListener('mouseup', stopRecording);
        micBtn.addEventListener('mouseleave', stopRecording);
        micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
        micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            if (ws) ws.send(JSON.stringify({command: 'reset'}));
        });
        
        connect();
        initAudio();
    </script>
</body>
</html>
