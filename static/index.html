<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoixAI v3.0 - Voice Ordering</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #eee;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            color: #e94560;
            font-size: 2rem;
            margin-bottom: 5px;
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(78, 204, 163, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ecca3;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status-dot.recording {
            background: #e94560;
            animation: pulse 0.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
        }
        
        .chat-area {
            flex: 1;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 20px;
            min-height: 300px;
            max-height: 500px;
        }
        
        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-user { text-align: right; }
        .message-bot { text-align: left; }
        
        .message-bubble {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 70%;
            word-wrap: break-word;
        }
        
        .message-user .message-bubble {
            background: #e94560;
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .message-bot .message-bubble {
            background: rgba(255,255,255,0.1);
            color: #eee;
            border-bottom-left-radius: 5px;
        }
        
        .input-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 30px;
            background: rgba(255,255,255,0.1);
            color: #eee;
            font-size: 1rem;
            outline: none;
            min-width: 200px;
        }
        
        input[type="text"]::placeholder {
            color: rgba(255,255,255,0.5);
        }
        
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            background: #e94560;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #c73e54;
            transform: scale(1.05);
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        
        .mic-btn {
            background: #4ecca3;
            padding: 15px;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        
        .mic-btn:hover {
            background: #3db892;
        }
        
        .mic-btn.recording {
            background: #e94560;
            animation: pulse 0.5s infinite;
        }
        
        .connection-status {
            text-align: center;
            padding: 10px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.6);
        }
        
        .latency {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            margin-top: 5px;
        }
        
        .info-box {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        
        .info-box h3 {
            color: #e94560;
            margin-bottom: 10px;
        }
        
        .mode-indicator {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            margin-left: 10px;
        }
        
        .mode-real {
            background: #4ecca3;
            color: #1a1a2e;
        }
        
        .mode-mock {
            background: #ffa500;
            color: #1a1a2e;
        }
        
        .voice-indicator {
            text-align: center;
            padding: 10px;
            font-size: 0.85rem;
            min-height: 30px;
            color: #4ecca3;
        }
        
        .voice-indicator.recording {
            color: #e94560;
        }
        
        .voice-indicator.error {
            color: #ffa500;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>VoixAI v3.0</h1>
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Online</span>
            <span id="modeIndicator" class="mode-indicator mode-mock">Mock</span>
        </div>
    </div>
    
    <div class="container">
        <div class="info-box">
            <h3>Welcome to VoixAI!</h3>
            <p>I'm Tasha, your Wingstop cashier. <strong>Click and HOLD the mic button</strong> to talk, or type your order.</p>
            <p><strong>Try saying:</strong> "Hi, I'd like to order some wings"</p>
        </div>
        
        <div class="chat-area" id="chatArea">
            <div class="message message-bot">
                <div class="message-bubble">
                    Hey there! Welcome to Wingstop! I'm Tasha. What can I get for you today?
                </div>
            </div>
        </div>
        
        <div class="voice-indicator" id="voiceIndicator">Initializing...</div>
        <div class="connection-status" id="connectionStatus">Connecting...</div>
        
        <div class="input-area">
            <button class="mic-btn" id="micBtn" disabled title="Hold to talk">🎤</button>
            <input type="text" id="messageInput" placeholder="Type your message..." disabled>
            <button id="sendBtn" disabled>Send</button>
        </div>
    </div>
    
    <script>
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const connectionStatus = document.getElementById('connectionStatus');
        const voiceIndicator = document.getElementById('voiceIndicator');
        const statusDot = document.getElementById('statusDot');
        const modeIndicator = document.getElementById('modeIndicator');
        
        let ws = null;
        let sessionId = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        
        // Audio recording
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let voiceReady = false;
        
        // Initialize audio
        async function initAudio() {
            try {
                // Check if MediaRecorder is supported
                if (!window.MediaRecorder) {
                    throw new Error('MediaRecorder not supported');
                }
                
                // Test microphone access
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                
                voiceReady = true;
                voiceIndicator.textContent = 'Ready - Hold mic to speak';
                console.log('Audio initialized successfully');
                
            } catch (err) {
                console.error('Audio init error:', err);
                voiceReady = false;
                voiceIndicator.textContent = 'Voice unavailable: ' + err.message;
                voiceIndicator.className = 'voice-indicator error';
                micBtn.style.display = 'none';
            }
        }
        
        // Start recording
        async function startRecording() {
            if (isRecording || !voiceReady) return;
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        channelCount: 1,
                        sampleRate: 16000,
                        echoCancellation: true,
                        noiseSuppression: true
                    } 
                });
                
                // Try different mime types
                let mimeType = 'audio/webm;codecs=opus';
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'audio/webm';
                }
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'audio/mp4';
                }
                
                console.log('Using mime type:', mimeType);
                
                mediaRecorder = new MediaRecorder(stream, { mimeType });
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = async () => {
                    console.log('Recording stopped, processing...');
                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                    await sendAudio(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start(100);
                isRecording = true;
                
                micBtn.classList.add('recording');
                statusDot.classList.add('recording');
                voiceIndicator.textContent = 'Recording... Release to send';
                voiceIndicator.classList.add('recording');
                
            } catch (err) {
                console.error('Recording error:', err);
                voiceIndicator.textContent = 'Mic error: ' + err.message;
                voiceIndicator.className = 'voice-indicator error';
            }
        }
        
        // Stop recording
        function stopRecording() {
            if (!isRecording || !mediaRecorder) return;
            
            mediaRecorder.stop();
            isRecording = false;
            
            micBtn.classList.remove('recording');
            statusDot.classList.remove('recording');
            voiceIndicator.classList.remove('recording');
            voiceIndicator.textContent = 'Processing...';
        }
        
        // Send audio to server
        async function sendAudio(audioBlob) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                voiceIndicator.textContent = 'Not connected';
                return;
            }
            
            try {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64Audio = reader.result.split(',')[1];
                    
                    console.log('Sending audio:', base64Audio.length, 'chars');
                    
                    ws.send(JSON.stringify({
                        type: 'audio',
                        data: base64Audio,
                        format: 'webm'
                    }));
                };
                reader.readAsDataURL(audioBlob);
                
            } catch (err) {
                console.error('Send audio error:', err);
                voiceIndicator.textContent = 'Error sending audio';
            }
        }
        
        // WebSocket connection
        function connect() {
            if (reconnectAttempts >= maxReconnectAttempts) {
                connectionStatus.textContent = 'Failed to connect. Please refresh.';
                return;
            }
            
            reconnectAttempts++;
            const wsUrl = `ws://${window.location.host}/ws`;
            console.log(`Connecting to ${wsUrl}`);
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log('WebSocket connected');
                reconnectAttempts = 0;
                connectionStatus.textContent = 'Connected';
                messageInput.disabled = false;
                sendBtn.disabled = false;
                if (voiceReady) {
                    micBtn.disabled = false;
                }
                messageInput.focus();
                
                ws.send(JSON.stringify({ type: 'start_conversation' }));
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Received:', data);
                
                if (data.type === 'system' && data.event === 'session_started') {
                    sessionId = data.session_id;
                    
                    fetch('/health')
                        .then(r => r.json())
                        .then(h => {
                            const isReal = h.real_stt || h.real_tts;
                            modeIndicator.textContent = isReal ? 'Real Voice' : 'Mock';
                            modeIndicator.className = 'mode-indicator ' + (isReal ? 'mode-real' : 'mode-mock');
                        });
                }
                else if (data.type === 'user_transcript') {
                    addMessage(data.content, 'user');
                }
                else if (data.type === 'bot_text') {
                    addMessage(data.content, 'bot', data.latency_ms);
                    speak(data.content);
                    voiceIndicator.textContent = 'Ready - Hold mic to speak';
                }
                else if (data.type === 'error') {
                    addMessage(data.content, 'bot');
                    voiceIndicator.textContent = 'Error. Try again.';
                }
            };
            
            ws.onclose = () => {
                connectionStatus.textContent = `Reconnecting... (${reconnectAttempts}/${maxReconnectAttempts})`;
                messageInput.disabled = true;
                sendBtn.disabled = true;
                micBtn.disabled = true;
                setTimeout(connect, 3000);
            };
            
            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
                connectionStatus.textContent = 'Connection error';
            };
        }
        
        // Text-to-speech
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.2;
                utterance.pitch = 1;
                
                const voices = window.speechSynthesis.getVoices();
                const voice = voices.find(v => v.name.includes('Google') || v.name.includes('Samantha'));
                if (voice) utterance.voice = voice;
                
                window.speechSynthesis.speak(utterance);
            }
        }
        
        function addMessage(text, sender, latency = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${sender}`;
            
            let latencyText = latency ? `<div class="latency">${latency.toFixed(0)}ms</div>` : '';
            
            messageDiv.innerHTML = `
                <div class="message-bubble">
                    ${escapeHtml(text)}
                    ${latencyText}
                </div>
            `;
            
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function sendMessage(text) {
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            
            ws.send(JSON.stringify({
                type: 'text',
                content: text
            }));
            
            voiceIndicator.textContent = 'Thinking...';
        }
        
        // Event listeners
        micBtn.addEventListener('mousedown', startRecording);
        micBtn.addEventListener('mouseup', stopRecording);
        micBtn.addEventListener('mouseleave', stopRecording);
        
        micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
        micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
        
        sendBtn.addEventListener('click', () => {
            const text = messageInput.value.trim();
            if (text) {
                addMessage(text, 'user');
                sendMessage(text);
                messageInput.value = '';
            }
        });
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });
        
        // Start everything
        initAudio();
        connect();
    </script>
</body>
</html>
