<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoixAI - Drive Thru</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 20px 0;
        }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .main-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: none;
            margin: 30px auto;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .main-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .main-button.idle {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.3);
        }
        .main-button.idle:hover {
            transform: scale(1.05);
        }
        .main-button.recording {
            background: linear-gradient(135deg, #00b894, #00a085);
            color: white;
            animation: recording-pulse 1s infinite;
        }
        @keyframes recording-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 184, 148, 0.7); }
            50% { box-shadow: 0 0 0 30px rgba(0, 184, 148, 0); }
        }
        .main-button.processing {
            background: linear-gradient(135deg, #fdcb6e, #f39c12);
            color: #333;
        }
        .status-text {
            text-align: center;
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 10px;
        }
        .timer {
            text-align: center;
            font-size: 2rem;
            font-family: monospace;
            color: #00d4ff;
            margin: 10px 0;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 15px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 200px;
        }
        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 1rem;
            line-height: 1.5;
            animation: message-in 0.3s ease;
        }
        @keyframes message-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #00b894, #00a085);
            border-bottom-right-radius: 5px;
        }
        .message.assistant {
            align-self: flex-start;
            background: linear-gradient(135deg, #0984e3, #0769b5);
            border-bottom-left-radius: 5px;
        }
        .message.system {
            align-self: center;
            background: rgba(255,255,255,0.1);
            font-size: 0.9rem;
            color: #888;
        }
        .order-panel {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
        }
        .order-panel h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .reset-btn {
            padding: 8px 16px;
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .order-item {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
        }
        .order-item .qty {
            color: #00d4ff;
            font-weight: bold;
            margin-right: 8px;
        }
        .order-empty {
            color: #666;
            text-align: center;
            padding: 20px;
        }
        .order-total {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 12px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }
        .instructions {
            background: rgba(0,0,0,0.2);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .instructions h3 {
            color: #00d4ff;
            margin-bottom: 10px;
        }
        .instructions ol {
            margin-left: 20px;
            color: #aaa;
        }
        .instructions li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>VoixAI</h1>
            <p>Drive-Thru Voice Ordering</p>
        </div>
        
        <div class="instructions">
            <h3>How to order:</h3>
            <ol>
                <li>Click and HOLD the red button</li>
                <li>Say your order (e.g., "10 lemon pepper wings and a Coke")</li>
                <li>RELEASE the button when done</li>
                <li>Tasha will confirm and ask if you need anything else</li>
            </ol>
        </div>
        
        <div class="status-text" id="statusText">Ready - hold button to speak</div>
        <div class="timer" id="timer" style="display: none;">0.0s</div>
        
        <button class="main-button idle" id="mainBtn">
            <span style="font-size: 3rem;">🎤</span>
            <span id="btnText">HOLD TO SPEAK</span>
        </button>
        
        <div class="chat-container" id="chatLog"></div>
        
        <div class="order-panel">
            <h2>
                Your Order
                <button class="reset-btn" id="resetBtn">Reset</button>
            </h2>
            <div id="orderList">
                <div class="order-empty">No items yet</div>
            </div>
        </div>
    </div>

    <script>
        const WS_URL = `ws://${window.location.host}/ws/order`;
        
        const mainBtn = document.getElementById('mainBtn');
        const btnText = document.getElementById('btnText');
        const statusText = document.getElementById('statusText');
        const timer = document.getElementById('timer');
        const chatLog = document.getElementById('chatLog');
        const orderList = document.getElementById('orderList');
        
        let ws = null;
        let audioContext = null;
        let processor = null;
        let isRecording = false;
        let recordingStartTime = null;
        let timerInterval = null;
        
        function addMessage(text, role) {
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            msg.textContent = text;
            chatLog.appendChild(msg);
            chatLog.scrollTop = chatLog.scrollHeight;
        }
        
        function updateOrder(order) {
            if (!order || !order.items || order.items.length === 0) {
                orderList.innerHTML = '<div class="order-empty">No items yet</div>';
                return;
            }
            let html = '';
            for (const item of order.items) {
                html += `<div class="order-item">
                    <span class="qty">${item.qty}x</span>
                    ${item.name}
                    ${item.modifiers ? `<br><small style="color:#888">${item.modifiers}</small>` : ''}
                </div>`;
            }
            html += `<div class="order-total"><span>Total Items:</span><span>${order.total_items}</span></div>`;
            orderList.innerHTML = html;
        }
        
        function playAudio(base64Data) {
            const audio = new Audio('data:audio/wav;base64,' + base64Data);
            audio.play().catch(err => console.error('Audio error:', err));
        }
        
        function updateTimer() {
            if (!recordingStartTime) return;
            const seconds = ((Date.now() - recordingStartTime) / 1000).toFixed(1);
            timer.textContent = seconds + 's';
        }
        
        function setButtonState(state) {
            mainBtn.className = 'main-button ' + state;
            if (state === 'idle') {
                btnText.textContent = 'HOLD TO SPEAK';
                statusText.textContent = 'Ready - hold button to speak';
                timer.style.display = 'none';
                clearInterval(timerInterval);
            } else if (state === 'recording') {
                btnText.textContent = 'RELEASE WHEN DONE';
                statusText.textContent = 'Recording... release when done';
                timer.style.display = 'block';
                recordingStartTime = Date.now();
                timerInterval = setInterval(updateTimer, 100);
            } else if (state === 'processing') {
                btnText.textContent = 'PROCESSING...';
                statusText.textContent = 'Processing your order...';
                timer.style.display = 'none';
                clearInterval(timerInterval);
            }
        }
        
        async function startRecording() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            isRecording = true;
            setButtonState('recording');
            
            // Tell server to start
            ws.send(JSON.stringify({command: 'start_recording'}));
            
            // Start audio capture
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true }
                });
                
                audioContext = new AudioContext({ sampleRate: 16000 });
                const source = audioContext.createMediaStreamSource(stream);
                processor = audioContext.createScriptProcessor(4096, 1, 1);
                
                source.connect(processor);
                processor.connect(audioContext.destination);
                
                let chunkCount = 0;
                processor.onaudioprocess = (e) => {
                    if (!isRecording) return;
                    const inputData = e.inputBuffer.getChannelData(0);
                    
                    // Calculate level for debug
                    let maxVal = 0;
                    for (let i = 0; i < inputData.length; i++) {
                        maxVal = Math.max(maxVal, Math.abs(inputData[i]));
                    }
                    
                    const int16Data = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        int16Data[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32768));
                    }
                    ws.send(int16Data.buffer);
                    
                    chunkCount++;
                    if (chunkCount === 1 || chunkCount % 20 === 0) {
                        console.log(`Sent chunk ${chunkCount}, max level: ${(maxVal*100).toFixed(1)}%`);
                    }
                };
            } catch (err) {
                console.error('Audio error:', err);
                addMessage('Microphone access denied', 'system');
                stopRecording();
            }
        }
        
        function stopRecording() {
            if (!isRecording) return;
            
            isRecording = false;
            setButtonState('processing');
            
            // Stop audio capture
            if (processor) {
                processor.disconnect();
                processor = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            
            // Tell server to stop and process
            ws.send(JSON.stringify({command: 'stop_recording'}));
        }
        
        function connect() {
            if (ws) ws.close();
            
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                console.log('Connected');
                mainBtn.disabled = false;
            };
            
            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                console.log('Received:', data.type);
                
                if (data.type === 'greeting' || data.type === 'response') {
                    addMessage(data.text, 'assistant');
                    if (data.audio) playAudio(data.audio);
                    if (data.order) updateOrder(data.order);
                    setButtonState('idle');
                }
                else if (data.type === 'error') {
                    addMessage(data.text, 'system');
                    setButtonState('idle');
                }
                else if (data.type === 'reset') {
                    chatLog.innerHTML = '';
                    updateOrder(null);
                }
            };
            
            ws.onclose = () => {
                console.log('Disconnected - reconnecting...');
                mainBtn.disabled = true;
                setTimeout(connect, 3000);
            };
            
            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
            };
        }
        
        // Button events
        mainBtn.addEventListener('mousedown', startRecording);
        mainBtn.addEventListener('mouseup', stopRecording);
        mainBtn.addEventListener('mouseleave', stopRecording);
        mainBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
        mainBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            if (ws) ws.send(JSON.stringify({command: 'reset'}));
        });
        
        connect();
    </script>
</body>
</html>
