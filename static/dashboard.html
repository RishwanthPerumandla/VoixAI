<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoixAI - Order Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        
        .header {
            background: #16213e;
            padding: 20px;
            border-bottom: 3px solid #e94560;
        }
        
        .header h1 {
            color: #e94560;
            font-size: 28px;
        }
        
        .header p {
            color: #888;
            margin-top: 5px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        
        .stat-card {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            border-left: 4px solid #e94560;
        }
        
        .stat-card h3 {
            color: #888;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
        }
        
        .sessions-container {
            padding: 20px;
        }
        
        .sessions-container h2 {
            margin-bottom: 20px;
            color: #e94560;
        }
        
        .session-card {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #0f3460;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr auto;
            gap: 15px;
            align-items: center;
        }
        
        .session-card:hover {
            border-color: #e94560;
        }
        
        .customer-name {
            font-weight: bold;
            font-size: 18px;
            color: #fff;
        }
        
        .session-id {
            font-size: 12px;
            color: #666;
            font-family: monospace;
        }
        
        .order-state {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .state-building { background: #f39c12; color: #000; }
        .state-reviewing { background: #3498db; color: #fff; }
        .state-confirmed { background: #2ecc71; color: #000; }
        .state-empty { background: #95a5a6; color: #000; }
        
        .order-total {
            font-size: 24px;
            font-weight: bold;
            color: #2ecc71;
        }
        
        .item-count {
            color: #888;
            font-size: 14px;
        }
        
        .duration {
            color: #888;
            font-size: 14px;
        }
        
        .no-sessions {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        
        .no-sessions h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .refresh-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #0f3460;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .refresh-indicator.active {
            background: #e94560;
        }
        
        @media (max-width: 768px) {
            .session-card {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🍗 VoixAI Order Dashboard</h1>
        <p>Real-time view of all active customer sessions</p>
    </div>
    
    <div class="refresh-indicator" id="refreshIndicator">
        Last updated: <span id="lastUpdate">--:--:--</span>
    </div>
    
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <h3>Active Sessions</h3>
            <div class="value" id="activeSessions">0</div>
        </div>
        <div class="stat-card">
            <h3>Active Orders</h3>
            <div class="value" id="activeOrders">0</div>
        </div>
        <div class="stat-card">
            <h3>Total Revenue</h3>
            <div class="value" id="totalRevenue">$0</div>
        </div>
        <div class="stat-card">
            <h3>Total Sessions Today</h3>
            <div class="value" id="totalSessions">0</div>
        </div>
    </div>
    
    <div class="sessions-container">
        <h2>Active Sessions</h2>
        <div id="sessionsList">
            <div class="no-sessions">
                <h3>No active sessions</h3>
                <p>Customers will appear here when they open the ordering page</p>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = window.location.origin;
        
        function formatCurrency(amount) {
            return '$' + parseFloat(amount).toFixed(2);
        }
        
        function formatDuration(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}m ${secs}s`;
        }
        
        function getStateClass(state) {
            const stateMap = {
                'building': 'state-building',
                'reviewing': 'state-reviewing',
                'confirmed': 'state-confirmed',
                'empty': 'state-empty'
            };
            return stateMap[state] || 'state-empty';
        }
        
        async function fetchDashboardData() {
            try {
                const response = await fetch(`${API_BASE}/api/dashboard`);
                if (!response.ok) throw new Error('Failed to fetch');
                
                const data = await response.json();
                updateDashboard(data);
                
                document.getElementById('lastUpdate').textContent = 
                    new Date().toLocaleTimeString();
                
                const indicator = document.getElementById('refreshIndicator');
                indicator.classList.add('active');
                setTimeout(() => indicator.classList.remove('active'), 500);
                
            } catch (error) {
                console.error('Error fetching dashboard:', error);
            }
        }
        
        function updateDashboard(data) {
            // Update stats
            document.getElementById('activeSessions').textContent = 
                data.stats.active_sessions;
            document.getElementById('activeOrders').textContent = 
                data.stats.active_orders;
            document.getElementById('totalRevenue').textContent = 
                formatCurrency(data.stats.total_revenue);
            document.getElementById('totalSessions').textContent = 
                data.stats.total_sessions;
            
            // Update sessions list
            const sessionsList = document.getElementById('sessionsList');
            
            if (data.active_sessions.length === 0) {
                sessionsList.innerHTML = `
                    <div class="no-sessions">
                        <h3>No active sessions</h3>
                        <p>Customers will appear here when they open the ordering page</p>
                    </div>
                `;
                return;
            }
            
            sessionsList.innerHTML = data.active_sessions.map(session => `
                <div class="session-card">
                    <div>
                        <div class="customer-name">${session.customer}</div>
                        <div class="session-id">${session.session_id}</div>
                    </div>
                    <div>
                        <span class="order-state ${getStateClass(session.order_state)}">
                            ${session.order_state}
                        </span>
                    </div>
                    <div>
                        <div class="order-total">${formatCurrency(session.total)}</div>
                        <div class="item-count">${session.items} items</div>
                    </div>
                    <div class="duration">
                        Duration: ${formatDuration(session.duration)}
                    </div>
                    <div>
                        <span style="color: #888; font-size: 12px;">
                            ${session.messages} messages
                        </span>
                    </div>
                </div>
            `).join('');
        }
        
        // Initial load
        fetchDashboardData();
        
        // Auto-refresh every 2 seconds
        setInterval(fetchDashboardData, 2000);
    </script>
</body>
</html>
