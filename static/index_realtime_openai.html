<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wingstop - Tasha AI (Realtime)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .header h1 {
            font-size: 2.8rem;
            background: linear-gradient(90deg, #ff6b35, #f7931e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .badge {
            display: inline-block;
            background: #00b894;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            margin-top: 30px;
        }
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
        }
        .call-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
        }
        .status-indicator {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .status-indicator.idle {
            background: rgba(255,255,255,0.1);
            border: 3px solid #666;
        }
        .status-indicator.connecting {
            background: rgba(253, 203, 110, 0.2);
            border: 3px solid #fdcb6e;
            animation: pulse 1.5s infinite;
        }
        .status-indicator.active {
            background: rgba(0, 184, 148, 0.2);
            border: 3px solid #00b894;
            animation: pulse 1s infinite;
        }
        .status-indicator.speaking {
            background: rgba(231, 76, 60, 0.3);
            border: 3px solid #e74c3c;
            transform: scale(1.1);
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 184, 148, 0.4); }
            50% { box-shadow: 0 0 0 20px rgba(0, 184, 148, 0); }
        }
        .call-status {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 10px;
        }
        .call-status.active {
            color: #00b894;
        }
        .debug-info {
            width: 100%;
            max-width: 500px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 0.8rem;
            color: #888;
            max-height: 150px;
            overflow-y: auto;
        }
        .debug-info .log {
            margin-bottom: 5px;
        }
        .debug-info .log.error { color: #e74c3c; }
        .debug-info .log.success { color: #00b894; }
        .debug-info .log.info { color: #0984e3; }
        .call-button {
            padding: 15px 50px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .call-button.start {
            background: linear-gradient(135deg, #00b894, #00a085);
            color: white;
        }
        .call-button.end {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }
        .call-button:hover {
            transform: scale(1.05);
        }
        .info-text {
            color: #888;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-top: 20px;
            text-align: center;
        }
        .order-panel {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
        }
        .order-panel h2 {
            font-size: 1.3rem;
            color: #ff6b35;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍗 Wingstop</h1>
            <span class="badge">OpenAI Realtime API</span>
        </div>
        
        <div class="main-content">
            <div class="call-area">
                <div class="status-indicator idle" id="statusIndicator">
                    📞
                </div>
                <div class="call-status" id="callStatus">Ready to call</div>
                
                <div class="debug-info" id="debugInfo">
                    <div class="log">Click "Start Call" to begin</div>
                </div>
                
                <button class="call-button start" id="callButton" onclick="toggleCall()">
                    Start Call
                </button>
                
                <div class="info-text">
                    <p>Full-duplex conversation with OpenAI Realtime API</p>
                    <p>Speak naturally - interrupt anytime</p>
                </div>
            </div>
            
            <div class="order-panel">
                <h2>Your Order</h2>
                <div id="orderContent">
                    <div style="color: #666; text-align: center; padding: 40px 0;">
                        No order yet
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WS_URL = `ws://${window.location.host}/ws/realtime-openai`;
        
        let ws = null;
        let audioContext = null;
        let inputStream = null;
        let workletNode = null;
        let isCallActive = false;
        let audioQueue = [];
        let isPlaying = false;
        
        const statusIndicator = document.getElementById('statusIndicator');
        const callStatus = document.getElementById('callStatus');
        const callButton = document.getElementById('callButton');
        const debugInfo = document.getElementById('debugInfo');
        
        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            debugInfo.appendChild(div);
            debugInfo.scrollTop = debugInfo.scrollHeight;
            console.log(msg);
        }
        
        async function startCall() {
            isCallActive = true;
            callButton.textContent = 'End Call';
            callButton.className = 'call-button end';
            statusIndicator.className = 'status-indicator connecting';
            callStatus.textContent = 'Connecting...';
            
            log('Initializing audio context...');
            
            try {
                // Initialize audio context with default sample rate
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                log(`Audio context sample rate: ${audioContext.sampleRate}Hz`);
                
                // Get microphone access
                inputStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                log('Microphone access granted');
                
                // Connect WebSocket
                log('Connecting to server...');
                ws = new WebSocket(WS_URL);
                ws.binaryType = 'arraybuffer';
                
                ws.onopen = () => {
                    log('WebSocket connected', 'success');
                    statusIndicator.className = 'status-indicator active';
                    callStatus.textContent = 'Connected - Speak!';
                    callStatus.className = 'call-status active';
                    
                    // Start sending audio
                    startAudioCapture();
                };
                
                ws.onmessage = async (event) => {
                    if (event.data instanceof ArrayBuffer) {
                        // Binary audio data from AI
                        log(`Received ${event.data.byteLength} bytes of audio`);
                        await queueAudio(event.data);
                    } else {
                        // JSON event
                        const data = JSON.parse(event.data);
                        handleEvent(data);
                    }
                };
                
                ws.onclose = () => {
                    log('WebSocket closed');
                    endCall();
                };
                
                ws.onerror = (err) => {
                    log('WebSocket error: ' + err.message, 'error');
                };
                
            } catch (err) {
                log('Failed to start: ' + err.message, 'error');
                endCall();
            }
        }
        
        function startAudioCapture() {
            const source = audioContext.createMediaStreamSource(inputStream);
            const processor = audioContext.createScriptProcessor(4096, 1, 1);
            
            source.connect(processor);
            processor.connect(audioContext.destination);
            
            processor.onaudioprocess = (e) => {
                if (!isCallActive || !ws || ws.readyState !== WebSocket.OPEN) return;
                
                const inputData = e.inputBuffer.getChannelData(0);
                
                // Resample if needed (browser native rate -> 24000)
                const targetSampleRate = 24000;
                const sourceSampleRate = audioContext.sampleRate;
                
                let resampled;
                if (sourceSampleRate !== targetSampleRate) {
                    // Simple resampling
                    const ratio = targetSampleRate / sourceSampleRate;
                    const newLength = Math.floor(inputData.length * ratio);
                    resampled = new Float32Array(newLength);
                    for (let i = 0; i < newLength; i++) {
                        resampled[i] = inputData[Math.floor(i / ratio)];
                    }
                } else {
                    resampled = inputData;
                }
                
                // Convert to 16-bit PCM
                const pcmData = new Int16Array(resampled.length);
                for (let i = 0; i < resampled.length; i++) {
                    pcmData[i] = Math.max(-32768, Math.min(32767, resampled[i] * 32768));
                }
                
                // Send as binary
                ws.send(pcmData.buffer);
            };
            
            log('Audio capture started');
        }
        
        async function queueAudio(audioData) {
            audioQueue.push(audioData);
            if (!isPlaying) {
                playNextAudio();
            }
        }
        
        async function playNextAudio() {
            if (audioQueue.length === 0 || !isCallActive) {
                isPlaying = false;
                return;
            }
            
            isPlaying = true;
            const audioData = audioQueue.shift();
            
            try {
                // Convert PCM16 to float32
                const int16Data = new Int16Array(audioData);
                const floatData = new Float32Array(int16Data.length);
                
                for (let i = 0; i < int16Data.length; i++) {
                    floatData[i] = int16Data[i] / 32768;
                }
                
                // Create audio buffer at 24000Hz
                const audioBuffer = audioContext.createBuffer(1, floatData.length, 24000);
                audioBuffer.copyToChannel(floatData, 0);
                
                // Play
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioContext.destination);
                
                source.onended = () => {
                    playNextAudio();
                };
                
                source.start();
                statusIndicator.className = 'status-indicator speaking';
                
            } catch (err) {
                log('Audio play error: ' + err.message, 'error');
                playNextAudio();
            }
        }
        
        function handleEvent(data) {
            log('Event: ' + data.type);
            
            switch (data.type) {
                case 'user_started_speaking':
                    statusIndicator.className = 'status-indicator active';
                    break;
                    
                case 'ai_response_complete':
                    statusIndicator.className = 'status-indicator active';
                    break;
                    
                case 'order_complete':
                    updateOrderDisplay(data.order);
                    break;
                    
                case 'error':
                    log('Error: ' + data.message, 'error');
                    break;
            }
        }
        
        function updateOrderDisplay(order) {
            const div = document.getElementById('orderContent');
            if (!order || !order.items || order.items.length === 0) {
                div.innerHTML = '<div style="color: #666; text-align: center; padding: 40px 0;">No order yet</div>';
                return;
            }
            
            let html = '';
            if (order.customer_name) {
                html += `<div style="color: #00d4ff; font-weight: bold; margin-bottom: 10px;">Customer: ${order.customer_name}</div>`;
            }
            
            html += '<div style="margin-bottom: 15px;">';
            order.items.forEach(item => {
                html += `<div style="padding: 8px; background: rgba(255,255,255,0.05); margin-bottom: 5px; border-radius: 5px;">
                    <strong>${item.qty}x</strong> ${item.name}
                </div>`;
            });
            html += '</div>';
            
            if (order.total) {
                html += `<div style="padding: 10px; background: rgba(0,184,148,0.1); border-radius: 5px; text-align: center;">
                    <strong style="color: #00b894; font-size: 1.2rem;">Total: $${order.total.toFixed(2)}</strong>
                </div>`;
            }
            
            div.innerHTML = html;
        }
        
        function endCall() {
            isCallActive = false;
            audioQueue = [];
            
            callButton.textContent = 'Start Call';
            callButton.className = 'call-button start';
            statusIndicator.className = 'status-indicator idle';
            callStatus.textContent = 'Ready to call';
            callStatus.className = 'call-status';
            
            if (inputStream) {
                inputStream.getTracks().forEach(t => t.stop());
                inputStream = null;
            }
            
            if (ws) {
                ws.close();
                ws = null;
            }
            
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            
            log('Call ended');
        }
        
        function toggleCall() {
            if (isCallActive) {
                endCall();
            } else {
                startCall();
            }
        }
    </script>
</body>
</html>
