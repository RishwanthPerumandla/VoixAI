<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoixAI v2 - Always Listening</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            height: 100vh;
        }
        .main-panel {
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        .status-dot.listening { background: #00b894; }
        .status-dot.processing { background: #fdcb6e; animation: none; }
        .status-dot.speaking { background: #0984e3; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { align-self: flex-end; background: linear-gradient(135deg, #00b894, #00a085); border-bottom-right-radius: 4px; }
        .message.assistant { align-self: flex-start; background: linear-gradient(135deg, #0984e3, #0769b5); border-bottom-left-radius: 4px; }
        .message.system { align-self: center; background: rgba(255,255,255,0.1); font-size: 0.8rem; color: #888; }
        .latency-bar { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 10px; margin-bottom: 10px; }
        .latency-item { text-align: center; padding: 5px 10px; background: rgba(255,255,255,0.05); border-radius: 6px; }
        .latency-item .label { font-size: 0.65rem; color: #888; text-transform: uppercase; }
        .latency-item .value { font-size: 0.85rem; font-weight: bold; font-family: monospace; }
        .side-panel { display: flex; flex-direction: column; gap: 20px; }
        .order-panel, .status-panel { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; }
        .order-panel h2, .status-panel h2 { font-size: 1.1rem; margin-bottom: 15px; }
        .order-item { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; margin-bottom: 8px; font-size: 0.9rem; }
        .order-item .qty { font-weight: bold; color: #00d4ff; }
        .order-empty { color: #666; text-align: center; padding: 20px; }
        .order-total { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; margin-top: 12px; display: flex; justify-content: space-between; font-weight: bold; }
        .reset-btn { width: 100%; padding: 12px; margin-top: 15px; background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.3); border-radius: 8px; cursor: pointer; }
        .instructions { text-align: center; color: #888; font-size: 0.9rem; margin-top: 10px; }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
            .side-panel { order: -1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-panel">
            <div class="header">
                <h1>VoixAI v2</h1>
                <p>Always Listening Mode</p>
                <div class="status-indicator" id="statusIndicator">
                    <span class="status-dot listening" id="statusDot"></span>
                    <span id="statusText">Listening...</span>
                </div>
            </div>
            
            <div class="chat-container" id="chatLog"></div>
            
            <div class="latency-bar" id="latencyBar" style="display: none;">
                <div class="latency-item"><div class="label">STT</div><div class="value" id="sttMs">--</div></div>
                <div class="latency-item"><div class="label">LLM</div><div class="value" id="llmMs">--</div></div>
                <div class="latency-item"><div class="label">TTS</div><div class="value" id="ttsMs">--</div></div>
                <div class="latency-item"><div class="label">Total</div><div class="value" id="totalMs">--</div></div>
            </div>
            
            <div class="instructions">
                Just speak naturally - no button needed. Pause when done speaking.
            </div>
            
            <div style="margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px;">
                <div style="font-size: 0.8rem; color: #888; margin-bottom: 5px;">Microphone Level:</div>
                <div style="width: 100%; height: 20px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden;">
                    <div id="volumeBar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #00b894, #fdcb6e, #e74c3c); transition: width 0.1s;"></div>
                </div>
                <div id="volumeText" style="font-size: 0.75rem; color: #666; margin-top: 5px;">Waiting for audio...</div>
            </div>
            
            <div id="debugLog" style="margin-top: 20px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; font-family: monospace; font-size: 12px; max-height: 150px; overflow-y: auto; color: #888;">
                Debug logs will appear here...
            </div>
        </div>
        
        <div class="side-panel">
            <div class="order-panel">
                <h2>Current Order</h2>
                <div id="orderList"><div class="order-empty">No items</div></div>
                <button class="reset-btn" id="resetBtn">Reset Order</button>
            </div>
            <div class="status-panel">
                <h2>Status</h2>
                <div>State: <span id="stateValue">-</span></div>
                <div>Items: <span id="itemCount">0</span></div>
            </div>
        </div>
    </div>

    <script>
        const WS_URL = `ws://${window.location.host}/ws/conversation`;
        const SAMPLE_RATE = 16000;
        
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const chatLog = document.getElementById('chatLog');
        
        let ws = null;
        let audioContext = null;
        let processor = null;
        
        function debug(msg) {
            console.log(msg);
            const div = document.getElementById('debugLog');
            const line = document.createElement('div');
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            div.appendChild(line);
            div.scrollTop = div.scrollHeight;
        }
        
        function setStatus(status) {
            statusDot.className = 'status-dot ' + status;
            if (status === 'listening') statusText.textContent = 'Listening...';
            else if (status === 'processing') statusText.textContent = 'Processing...';
            else if (status === 'speaking') statusText.textContent = 'Speaking...';
        }
        
        function addMessage(text, role) {
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            msg.textContent = text;
            chatLog.appendChild(msg);
            chatLog.scrollTop = chatLog.scrollHeight;
        }
        
        function updateOrder(order) {
            if (!order || !order.items || order.items.length === 0) {
                document.getElementById('orderList').innerHTML = '<div class="order-empty">No items</div>';
                return;
            }
            let html = '';
            for (const item of order.items) {
                html += `<div class="order-item"><span class="qty">${item.qty}x</span> ${item.name}</div>`;
            }
            html += `<div class="order-total"><span>Total:</span><span>${order.total_items}</span></div>`;
            document.getElementById('orderList').innerHTML = html;
        }
        
        function playAudio(base64Data) {
            setStatus('speaking');
            const audio = new Audio('data:audio/wav;base64,' + base64Data);
            audio.onended = () => setStatus('listening');
            audio.play().catch(err => {
                console.error('Audio error:', err);
                setStatus('listening');
            });
        }
        
        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { sampleRate: SAMPLE_RATE, channelCount: 1, echoCancellation: true }
                });
                
                audioContext = new AudioContext({ sampleRate: SAMPLE_RATE });
                const source = audioContext.createMediaStreamSource(stream);
                processor = audioContext.createScriptProcessor(4096, 1, 1);
                
                source.connect(processor);
                processor.connect(audioContext.destination);
                
                let chunkCount = 0;
                const volumeBar = document.getElementById('volumeBar');
                const volumeText = document.getElementById('volumeText');
                
                processor.onaudioprocess = (e) => {
                    if (!ws || ws.readyState !== WebSocket.OPEN) return;
                    const inputData = e.inputBuffer.getChannelData(0);
                    
                    // Calculate audio level
                    let maxVal = 0;
                    let sumSquares = 0;
                    for (let i = 0; i < inputData.length; i++) {
                        maxVal = Math.max(maxVal, Math.abs(inputData[i]));
                        sumSquares += inputData[i] * inputData[i];
                    }
                    const rms = Math.sqrt(sumSquares / inputData.length);
                    
                    // Update volume meter
                    const volumePercent = Math.min(100, (rms * 100 * 3)).toFixed(0);
                    volumeBar.style.width = volumePercent + '%';
                    
                    if (rms < 0.01) {
                        volumeText.textContent = 'Too quiet - speak louder or check mic';
                        volumeText.style.color = '#e74c3c';
                    } else if (rms < 0.05) {
                        volumeText.textContent = 'Quiet but detected';
                        volumeText.style.color = '#fdcb6e';
                    } else {
                        volumeText.textContent = 'Good level';
                        volumeText.style.color = '#00b894';
                    }
                    
                    // Convert to int16
                    const int16Data = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        int16Data[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32768));
                    }
                    
                    ws.send(int16Data.buffer);
                    
                    // Debug log every 50 chunks
                    chunkCount++;
                    if (chunkCount % 50 === 1) {
                        debug(`Audio chunk #${chunkCount}, level: ${(rms*100).toFixed(1)}%`);
                    }
                };
                
                debug('Audio initialized - sending data');
            } catch (err) {
                debug('ERROR: Audio init failed - ' + err.message);
                addMessage('Microphone access required', 'system');
            }
        }
        
        function connect() {
            if (ws) ws.close();
            
            debug('Connecting...');
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                debug('Connected - always listening mode');
                setStatus('listening');
            };
            
            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                debug('Received: ' + data.type + (data.text ? ' - "' + data.text.substring(0, 30) + '..."' : ''));
                
                if (data.type === 'greeting' || data.type === 'response') {
                    addMessage(data.text, 'assistant');
                    if (data.audio) playAudio(data.audio);
                    if (data.order) updateOrder(data.order);
                    if (data.state) {
                        document.getElementById('stateValue').textContent = data.state.state;
                        document.getElementById('itemCount').textContent = data.state.total_items;
                    }
                    if (data.latency) {
                        document.getElementById('latencyBar').style.display = 'flex';
                        document.getElementById('sttMs').textContent = data.latency.stt_ms + 'ms';
                        document.getElementById('llmMs').textContent = data.latency.llm_ms + 'ms';
                        document.getElementById('ttsMs').textContent = data.latency.tts_ms + 'ms';
                        document.getElementById('totalMs').textContent = data.latency.total_ms + 'ms';
                    }
                }
                else if (data.type === 'processing') {
                    setStatus('processing');
                }
                else if (data.type === 'error') {
                    addMessage(data.text, 'system');
                    setStatus('listening');
                }
                else if (data.type === 'reset') {
                    chatLog.innerHTML = '';
                    updateOrder(null);
                    setStatus('listening');
                }
            };
            
            ws.onclose = () => {
                console.log('Disconnected - reconnecting...');
                setTimeout(connect, 3000);
            };
            
            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
            };
        }
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            if (ws) ws.send(JSON.stringify({command: 'reset'}));
        });
        
        connect();
        initAudio();
    </script>
</body>
</html>
