app:
  name: "VoixAI"

hardware:
  device: "cpu"
  sample_rate: 16000

audio:
  vad_threshold: 0.4
  silence_duration_ms: 1500
  min_utterance_ms: 800
  audio_gain: 10.0
  normalization: true
  noise_gate: 0.01

stt:
  model: "tiny.en"
  compute_type: "int8"
  language: "en"
  # Options: tiny.en (fastest, ~100ms), base.en (balanced, ~300ms), small.en (slowest, ~1s)

llm:
  provider: "groq"
  model: "llama-3.3-70b-versatile"
  temperature: 0.3
  max_tokens: 150

tts:
  voice: "af_bella"
  speed: 1.3
  sample_rate: 24000

database:
  path: "orders.db"
