app:
  name: "VoixAI v2.0"
  version: "2.0.0"

hardware:
  device: "cpu"
  sample_rate: 16000

audio:
  vad_threshold: 0.4
  silence_duration_ms: 800
  min_utterance_ms: 400
  audio_gain: 10.0
  normalization: true
  noise_gate: 0.01
  interruption_threshold: 0.7

stt:
  model: "tiny.en"              # tiny.en (fastest, ~100ms), base.en (balanced), small.en (accurate)
  compute_type: "int8"
  language: "en"
  streaming: true

llm:
  provider: "groq"
  model: "llama-3.3-70b-versatile"
  temperature: 0.3
  max_tokens: 150
  timeout_seconds: 2.0

tts:
  model_path: "models/kokoro-v1.0.onnx"
  voice: "af_bella"
  speed: 1.2
  sample_rate: 24000
  streaming: true

agent:
  max_turns: 50
  working_memory_turns: 5
  confidence_threshold: 0.7
  
  # Response strategies
  strategies:
    discovery: "socratic_questioning"
    confirmation: "mirroring_specific"
    upsell: "social_proof_value"
    recovery: "acknowledge_fix"
    complaint: "empathy_action"

memory:
  session_db: "data/orders.db"
  working_memory_file: "data/working_memory.json"

tools:
  enabled:
    - search_menu
    - calculate_price
    - validate_order
    - create_order
    - modify_order
    - create_ticket
    - escalate_to_human
    - get_order_status
    - suggest_upsell

# Database paths
database:
  path: "data/orders.db"

# Menu and policies
menu:
  path: "data/menu.json"

policies:
  path: "data/policies.json"
