services:
  livekit:
    image: livekit/livekit-server:latest
    command: ["--config", "/etc/livekit.yaml", "--dev"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50010:50000-50010/udp"
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      - livekit
    environment:
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      AGENT_NAME: ${AGENT_NAME:-my-agent}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      VOIXAI_DB_PATH: /data/voixai.db
    ports:
      - "8000:8000"
    volumes:
      - voixai-data:/data
      - voixai-shared:/app/.voixai

  agent-runtime:
    build:
      context: .
      dockerfile: docker/agent-runtime.Dockerfile
    depends_on:
      - livekit
      - api
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AGENT_NAME: ${AGENT_NAME:-my-agent}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-openai_realtime}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-5.3-chat-latest}
      STT_MODEL: ${STT_MODEL:-deepgram/flux-general}
      STT_LANGUAGE: ${STT_LANGUAGE:-en}
      TTS_MODEL: ${TTS_MODEL:-cartesia/sonic-3}
      TTS_SPEED: ${TTS_SPEED:-1.08}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-alloy}
      OPENAI_REALTIME_EAGERNESS: ${OPENAI_REALTIME_EAGERNESS:-medium}
      GOOGLE_REALTIME_MODEL: ${GOOGLE_REALTIME_MODEL:-gemini-3.1-flash-live-preview}
      GOOGLE_REALTIME_VOICE: ${GOOGLE_REALTIME_VOICE:-Achird}
      REALTIME_TEMPERATURE: ${REALTIME_TEMPERATURE:-0.6}
      VOIXAI_API_BASE_URL: http://api:8000
      VOIXAI_API_URL: http://api:8000
    volumes:
      - voixai-shared:/app/.voixai

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_LIVEKIT_ROOM_NAME: ${NEXT_PUBLIC_LIVEKIT_ROOM_NAME:-voixai-mvp-demo}
      NEXT_PUBLIC_PARTICIPANT_NAME: ${NEXT_PUBLIC_PARTICIPANT_NAME:-web-user}
      NEXT_PUBLIC_AGENT_NAME: ${AGENT_NAME:-my-agent}
      NEXT_PUBLIC_DEFAULT_VOICE_MODE: ${NEXT_PUBLIC_DEFAULT_VOICE_MODE:-openai_realtime}
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  voixai-data:
  voixai-shared:

